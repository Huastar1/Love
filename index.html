<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿阮真棒呀！！！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #a1c4fd 0%, #fbc2eb 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei", sans-serif;
            cursor: pointer;
            user-select: none;
        }

        /* --- 主文字样式 (带跳动效果) --- */
        .main-text {
            position: relative;
            z-index: 10;
            color: #fff;
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
            letter-spacing: 5px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* --- 点击生成的猫爪样式 --- */
        .paw-print {
            position: absolute;
            width: 80px;
            height: 80px;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: popInAndFade 1s forwards;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        @keyframes popInAndFade {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(10deg); opacity: 0; }
        }

        /* --- 背景飘浮爱心样式 --- */
        .bg-heart {
            position: absolute;
            bottom: -50px;
            font-size: 20px;
            animation: floatUp linear forwards;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-110vh) scale(1.5) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 主文字 -->
    <div class="main-text">阿阮真棒呀！！！</div>

    <script>
        // 1. 音乐播放逻辑：监听首次点击，绕过浏览器自动播放拦截
        const audio = new Audio('music.mp3'); // 确保同目录下有 music.mp3
        audio.loop = true; // 设置音乐循环播放
        let isMusicPlaying = false;

        document.addEventListener('click', function() {
            if (!isMusicPlaying) {
                audio.play().then(() => {
                    console.log('背景音乐已启动');
                    isMusicPlaying = true;
                }).catch(err => {
                    console.warn('播放失败:', err);
                });
            }
        }, { once: true }); // { once: true } 确保这段代码只执行一次

        // 2. 定义粉色猫爪的 SVG 图案
        const pawSvg = `
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <!-- 大肉垫 -->
            <path d="M256 224c-79.5 0-144 64.5-144 144s64.5 144 144 144 144-64.5 144-144-64.5-144-144-144z" fill="#ff9a9e"/>
            <!-- 四个小脚趾 -->
            <circle cx="120" cy="150" r="45" fill="#ff9a9e"/>
            <circle cx="200" cy="90" r="45" fill="#ff9a9e"/>
            <circle cx="312" cy="90" r="45" fill="#ff9a9e"/>
            <circle cx="392" cy="150" r="45" fill="#ff9a9e"/>
        </svg>`;

        // 3. 点击生成猫爪的逻辑
        document.addEventListener('click', function(e) {
            const paw = document.createElement('div');
            paw.className = 'paw-print';
            paw.innerHTML = pawSvg;

            // 设置位置
            paw.style.left = e.clientX + 'px';
            paw.style.top = e.clientY + 'px';

            // 随机大小和旋转
            const randomScale = 0.8 + Math.random() * 0.6;
            const randomRotate = (Math.random() - 0.5) * 60;
            paw.style.transform = `translate(-50%, -50%) scale(${randomScale}) rotate(${randomRotate}deg)`;

            document.body.appendChild(paw);

            // 动画结束后移除元素
            setTimeout(() => {
                paw.remove();
            }, 1000);
        });

        // 4. 自动生成背景爱心的逻辑
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            heart.innerHTML = '❤';

            // 随机位置和属性
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (15 + Math.random() * 30) + 'px';
            heart.style.animationDuration = (3 + Math.random() * 4) + 's';
            
            // 随机颜色
            const colors = ['rgba(255,255,255,0.5)', 'rgba(255,192,203,0.6)', 'rgba(255,105,180,0.4)'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];

            document.body.appendChild(heart);

            // 飘完后移除
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        // 每300毫秒生成一个爱心
        setInterval(createHeart, 300);
    </script>
</body>
</html>
